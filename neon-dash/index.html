<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Pantalla completa: el canvas es el juego y los menús son paneles de vidrio oscuro encima.
   Un solo mundo visual (arcade de neón), por eso no hay variante clara. */
:root {
  color-scheme: dark;
  --bg: #07081a;
  --ink: #eef0ff;
  --muted: #9ba2d6;
  --line: rgba(150, 160, 255, .26);
  --glass: rgba(9, 11, 34, .74);
  --cyan: #35f2d2;
  --pink: #ff4fd8;
  --amber: #ffc83d;
  --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', system-ui, sans-serif;
  --font-body: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

/* HUD durante la partida */
#hud { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 8px; z-index: 2; }
.icon {
  width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--glass); backdrop-filter: blur(8px);
}
.icon:hover { border-color: var(--cyan); }
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon .off { display: none; }
.muted .icon-snd .on { display: none; }
.muted .icon-snd .off { display: block; }

/* Pantallas */
.screen {
  position: absolute; inset: 0; z-index: 3; overflow: auto;
  display: flex; padding: 16px;
  background: radial-gradient(120% 90% at 50% 0%, rgba(7, 8, 26, .55), rgba(7, 8, 26, .9));
}
.panel { margin: auto; width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 20px; padding-block: 12px; }
.panel.small { max-width: 440px; text-align: center; align-items: center; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; backdrop-filter: blur(10px); }

.logo { margin: 0; font: 400 clamp(3rem, 11vw, 6.2rem)/.92 var(--font-display); letter-spacing: .01em; text-align: center; text-wrap: balance; }
.logo span:first-child { color: var(--cyan); text-shadow: 0 0 28px rgba(53, 242, 210, .55); }
.logo span:last-child { color: var(--pink); text-shadow: 0 0 28px rgba(255, 79, 216, .55); }
.tagline { margin: 0; text-align: center; color: var(--muted); font-size: 1.05rem; text-wrap: balance; }

.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.lv {
  --lv: var(--cyan);
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  padding: 16px; min-width: 0;
  border-radius: 16px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, .045);
  transition: transform .15s ease, border-color .15s ease, background .15s ease;
}
.lv:hover, .lv:focus-visible { transform: translateY(-3px); border-color: var(--lv); background: rgba(255, 255, 255, .08); }
.lv h2 { margin: 0; font: 400 1.5rem/1.1 var(--font-display); color: var(--lv); text-wrap: balance; }
.lv .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.pips { display: inline-flex; gap: 4px; align-items: center; }
.pips i { width: 11px; height: 11px; border-radius: 3px; background: rgba(255, 255, 255, .16); transform: rotate(45deg) scale(.82); }
.pips i.on { background: var(--lv); box-shadow: 0 0 8px var(--lv); }
.bar { height: 8px; border-radius: 6px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.bar b { display: block; height: 100%; width: 0; background: var(--lv); border-radius: 6px; }
.best { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.skins { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.label { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#skins { display: flex; gap: 10px; }
.skin {
  position: relative; width: 38px; height: 38px; padding: 0; border-radius: 9px;
  border: 2px solid #05060f; background: var(--a);
  box-shadow: 0 0 0 2px transparent;
}
.skin::before { content: ''; position: absolute; inset: 7px; border-radius: 4px; background: var(--b); }
.skin::after { content: ''; position: absolute; left: 11px; top: 13px; width: 4px; height: 4px; background: #05060f; box-shadow: 10px 0 0 #05060f; }
.skin[aria-checked="true"] { box-shadow: 0 0 0 3px var(--ink); }

.keys { margin: 0; text-align: center; color: var(--muted); font-size: .9rem; line-height: 1.9; text-wrap: balance; }
kbd { font: 500 .8rem var(--font-body); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, .07); color: var(--ink); }

.panel.small h2 { margin: 0; font: 400 2.2rem/1.05 var(--font-display); color: var(--cyan); text-wrap: balance; }
.panel.small p { margin: 0; color: var(--muted); }
.stats { display: flex; gap: 22px; justify-content: center; font-variant-numeric: tabular-nums; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats strong { font: 400 1.9rem/1 var(--font-display); color: var(--ink); }
.stats span { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.btn {
  padding: 13px 18px; border-radius: 14px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, .07); font-weight: 600; font-size: 1.02rem;
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}
.btn:hover, .btn:focus-visible { border-color: var(--cyan); background: rgba(255, 255, 255, .12); transform: translateY(-1px); }
.btn.main { background: var(--cyan); color: #04121a; border-color: var(--cyan); }
.btn.main:hover, .btn.main:focus-visible { background: #6bf7e0; }

@media (max-width: 760px) {
  .levels { grid-template-columns: minmax(0, 1fr); }
  .lv { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .lv h2 { flex: 1 1 100%; }
  .lv .bar { flex: 1 1 100%; }
  .lv .meta { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .lv, .btn { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Zona de juego"></canvas>

  <div id="hud" hidden>
    <button id="btnSnd" class="icon icon-snd" aria-label="Activar o silenciar sonido" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
        <path class="off" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>
      </svg>
    </button>
    <button id="btnPause" class="icon" aria-label="Pausar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </div>

  <section id="menu" class="screen" aria-label="Menú principal">
    <div class="panel">
      <h1 class="logo"><span>Neon</span> <span>Dash</span></h1>
      <p class="tagline">Un toque para saltar. Esquiva todo hasta la meta.</p>
      <div id="levels" class="levels"></div>
      <div class="skins">
        <span class="label">Tu cubo</span>
        <div id="skins" role="radiogroup" aria-label="Color del cubo"></div>
      </div>
      <p class="keys"><kbd>Espacio</kbd> <kbd>↑</kbd> o toca la pantalla para saltar · mantén pulsado para saltar sin parar · <kbd>P</kbd> pausa · <kbd>M</kbd> sonido</p>
    </div>
  </section>

  <section id="pause" class="screen" aria-label="Pausa" hidden>
    <div class="panel small">
      <h2>Pausa</h2>
      <div class="actions">
        <button class="btn main" id="pResume" type="button">Continuar</button>
        <button class="btn" id="pRestart" type="button">Reiniciar nivel</button>
        <button class="btn" id="pMenu" type="button">Menú</button>
      </div>
    </div>
  </section>

  <section id="win" class="screen" aria-label="Nivel completado" hidden>
    <div class="panel small">
      <h2 id="winTitle">¡Nivel completado!</h2>
      <p id="winName"></p>
      <div class="stats">
        <div><strong id="winTries">0</strong><span>Intentos</span></div>
        <div><strong id="winTime">0 s</strong><span>Tiempo</span></div>
      </div>
      <div class="actions">
        <button class="btn main" id="wNext" type="button">Siguiente nivel</button>
        <button class="btn" id="wAgain" type="button">Jugar de nuevo</button>
        <button class="btn" id="wMenu" type="button">Menú</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   FÍSICA  (unidades: casillas y segundos; y crece hacia arriba)
   ===================================================================== */
const DT = 1 / 120;            // paso fijo de simulación
const VX = 9.2;                // velocidad horizontal (casillas/s)
const GRAV = 54, JUMP_V = 16.5, FALL_MAX = 24;
const PAD_V = 21, ORB_V = 16;
const SHIP_UP = 42, SHIP_DOWN = 32, SHIP_VMAX = 8;
const COYOTE = 0.07;           // saltar justo después de salir de un borde
const BUFFER = 0.09;           // un toque justo antes de aterrizar cuenta como salto
const SNAP = 0.16;             // si rozas la esquina de un bloque, te sube en vez de matarte
const SHIP_H = 0.7;            // altura de la caja de la nave
const CEIL = 8;                // y del techo en los tramos de nave
const INSET = 0.14;            // los pinchos usan una caja de jugador algo más pequeña
const EPS = 1e-6;
const EV_JUMP = 1, EV_PAD = 2, EV_ORB = 4, EV_PORTAL = 8;
let MARGIN = 0;                // solo para pruebas: infla los peligros para medir holgura

function newState() {
  return { x: 0, y: 0, vy: 0, w: 1, h: 1, mode: 'cube', ground: true, dead: false, done: false,
           prevHold: false, pressT: 1, air: 0, jumped: false, used: [], rot: 0, t: 0, ev: 0 };
}

function rectHit(ax0, ax1, ay0, ay1, bx0, bx1, by0, by1) {
  return ax0 < bx1 && ax1 > bx0 && ay0 < by1 && ay1 > by0;
}

function step(s, lv, hold) {
  if (s.dead || s.done) return;
  const press = hold && !s.prevHold;
  s.prevHold = hold;
  s.pressT = press ? 0 : Math.min(s.pressT + DT, 1);
  const prevY = s.y;
  let landed = false;

  if (s.mode === 'cube') {
    const canJump = s.ground || (!s.jumped && s.air < COYOTE);
    if (canJump && (hold || s.pressT < BUFFER)) { s.vy = JUMP_V; s.ground = false; s.jumped = true; s.pressT = 1; s.ev |= EV_JUMP; }
    s.vy = Math.max(s.vy - GRAV * DT, -FALL_MAX);
  } else {
    s.vy += (hold ? SHIP_UP : -SHIP_DOWN) * DT;
    s.vy = Math.max(-SHIP_VMAX, Math.min(SHIP_VMAX, s.vy));
  }
  s.y += s.vy * DT;
  s.x += VX * DT;
  s.t += DT;

  if (s.y < 0) { s.y = 0; if (s.vy < 0) s.vy = 0; landed = true; }

  const c0 = Math.floor(s.x) - 1, c1 = Math.floor(s.x + s.w) + 1;
  for (let c = c0; c <= c1; c++) {
    const list = lv.cols[c];
    if (!list) continue;
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      switch (o.k) {
        case 'b': {
          if (rectHit(s.x, s.x + s.w, s.y, s.y + s.h, o.x, o.x + o.w, o.y, o.y + o.h)) {
            const top = o.y + o.h;
            if (s.vy <= 0 && prevY >= top - EPS) { s.y = top; s.vy = 0; landed = true; }
            else if (s.vy > 0 && prevY + s.h <= o.y + EPS) { s.y = o.y - s.h; s.vy = 0; }
            else if (s.mode === 'cube' && top - s.y <= SNAP) { s.y = top; s.vy = 0; landed = true; }
            else s.dead = true;
          } else if (MARGIN && rectHit(s.x - MARGIN, s.x + s.w + MARGIN, s.y, s.y + s.h, o.x, o.x + o.w, o.y, o.y + o.h)) {
            const canLand = s.vy <= 0 && prevY >= o.y + o.h - EPS;
            const canBump = s.vy > 0 && prevY + s.h <= o.y + EPS;
            if (!canLand && !canBump) s.dead = true;
          }
          break;
        }
        case 'h': {
          const m = MARGIN;
          if (rectHit(s.x + INSET, s.x + s.w - INSET, s.y + INSET, s.y + s.h - INSET,
                      o.x0 - m, o.x1 + m, o.y0 - m, o.y1 + m)) s.dead = true;
          break;
        }
        case 'p': {
          if (s.used.indexOf(o.id) < 0 && rectHit(s.x, s.x + s.w, s.y, s.y + s.h, o.x, o.x + 1, o.y, o.y + 0.3)) {
            s.used.push(o.id); s.vy = PAD_V; s.ground = false; s.jumped = true; landed = false; s.ev |= EV_PAD;
          }
          break;
        }
        case 'o': {
          if (s.used.indexOf(o.id) < 0 && s.pressT < 0.1 &&
              rectHit(s.x, s.x + s.w, s.y, s.y + s.h, o.x + 0.05, o.x + 0.95, o.y + 0.05, o.y + 0.95)) {
            s.used.push(o.id); s.vy = ORB_V; s.pressT = 1; s.ground = false; s.jumped = true; landed = false; s.ev |= EV_ORB;
          }
          break;
        }
        case 'g': {
          if (s.used.indexOf(o.id) < 0 && s.x + s.w > o.x + 0.2 && s.x < o.x + 0.8) {
            s.used.push(o.id);
            if (o.to === 'ship' && s.mode === 'cube') {
              s.mode = 'ship'; s.y += (1 - SHIP_H) / 2; s.h = SHIP_H; s.rot = 0; s.ev |= EV_PORTAL;
            } else if (o.to === 'cube' && s.mode === 'ship') {
              s.mode = 'cube'; s.y = Math.max(0, s.y - (1 - SHIP_H) / 2); s.h = 1; s.rot = 0; s.ground = false; s.jumped = true; s.ev |= EV_PORTAL;
            }
          }
          break;
        }
      }
      if (s.dead) return;
    }
  }
  if (s.mode === 'cube') {
    if (landed) { s.ground = true; s.jumped = false; s.air = 0; }
    else { s.ground = false; s.air += DT; }
  }
  if (s.x >= lv.end) s.done = true;
}

/* =====================================================================
   NIVELES
   Cada nivel se arma con "trozos" (chunks) colocados uno tras otro.
   Un número entre trozos es un tramo de pista libre (en casillas).
   ===================================================================== */
const CHUNKS = {
  // --- cubo ---
  s1:    L => { L.spike(0); return 1; },
  s2:    L => { L.spikes(0, 2); return 2; },
  s3:    L => { L.spikes(0, 3); return 3; },
  twin:  L => { L.spike(0); L.spike(7); return 8; },
  trio:  L => { L.spike(0); L.spike(7); L.spike(14); return 15; },
  twin2: L => { L.spikes(0, 2); L.spikes(7, 2); return 9; },
  half:  L => { L.spike(0, 0, { size: .5 }); L.spike(1, 0, { size: .5 }); L.spike(2, 0, { size: .5 }); return 3; },
  blk1:  L => { L.block(0, 0, 1, 1); return 1; },
  blk2:  L => { L.block(0, 0, 2, 1); L.spike(2); return 3; },
  spkBlk: L => { L.spike(0); L.block(4, 0, 3, 1); return 7; },
  blkSpk: L => { L.block(0, 0, 3, 1); L.spike(3); return 4; },
  stairs2: L => { L.block(0, 0, 3, 1); L.block(3, 0, 3, 2); return 6; },
  bridge:  L => { L.block(0, 0, 2, 1); L.spikes(2, 3); L.block(5, 0, 2, 1); return 7; },
  bridge2: L => { L.block(0, 0, 2, 1); L.spikes(2, 4); L.block(6, 0, 2, 1); return 8; },
  pad1:    L => { L.pad(0); L.spikes(3, 4); return 7; },
  padBlock: L => { L.pad(0); L.block(5, 0, 3, 2); return 8; },
  padTwo:  L => { L.pad(0); L.spikes(3, 3); L.pad(10); L.block(15, 0, 3, 2); return 18; },
  orb1:    L => { L.spikes(0, 6); L.orb(2.5, 1.6); return 6; },
  orb2:    L => { L.spikes(0, 11); L.orb(2.5, 1.6); L.orb(8, 1.6); return 11; },
  zig:     L => { L.block(0, 0, 1, 1); L.spike(4); L.block(8, 0, 1, 1); L.spike(12); return 13; },
  hurdles: L => { L.spikes(0, 2); L.block(5, 0, 2, 1); L.spikes(10, 3); return 13; },
  // --- nave ---
  shipA: L => {
    const W = 70;
    L.portal(0, 'ship', 0, 4);
    L.block(4, CEIL, W - 12, 40);
    L.block(16, 0, 2, 3); L.block(28, CEIL - 3, 2, 3); L.block(40, 0, 2, 3); L.block(52, CEIL - 3, 2, 3);
    L.portal(W - 3, 'cube', 0, CEIL);
    return W;
  },
  shipB: L => {
    const W = 88;
    L.portal(0, 'ship', 0, 4);
    L.block(4, CEIL, W - 12, 40);
    L.block(14, 0, 2, 3); L.block(24, CEIL - 3, 2, 3); L.block(34, 0, 2, 4); L.block(44, CEIL - 3, 2, 3);
    L.block(54, 0, 2, 3); L.block(64, CEIL - 4, 2, 4);
    L.portal(W - 3, 'cube', 0, CEIL);
    return W;
  },
};

function buildLevel(theme, spec) {
  const objs = [];
  let id = 0, ox = 0;
  const L = {
    block(x, y, w = 1, h = 1) { objs.push({ k: 'b', x: x + ox, y, w, h, id: id++ }); },
    spike(x, y = 0, o = {}) {
      const dir = o.dir || 'up', size = o.size || 1, hh = size === 1 ? 0.5 : 0.28;
      const X = x + ox;
      objs.push({ k: 'h', x: X, y, dir, size, id: id++,
        x0: X + 0.34, x1: X + 0.66,
        y0: dir === 'up' ? y : y + 1 - hh, y1: dir === 'up' ? y + hh : y + 1 });
    },
    spikes(x, n, y = 0, o = {}) { for (let i = 0; i < n; i++) L.spike(x + i, y, o); },
    pad(x, y = 0) { objs.push({ k: 'p', x: x + ox, y, id: id++ }); },
    orb(x, y) { objs.push({ k: 'o', x: x + ox, y, id: id++ }); },
    portal(x, to, y = 0, h = 4) { objs.push({ k: 'g', x: x + ox, y, to, h, id: id++ }); },
  };
  let x = spec.start == null ? 20 : spec.start;
  for (const item of spec.seq) {
    if (typeof item === 'number') { x += item; continue; }
    ox = x;
    x += CHUNKS[item](L);
  }
  const end = x + (spec.tail == null ? 14 : spec.tail);
  const cols = [];
  for (const o of objs) {
    const w = o.w || 1;
    for (let c = Math.floor(o.x); c <= Math.floor(o.x + w); c++) (cols[c] || (cols[c] = [])).push(o);
  }
  return Object.assign({}, theme, { objs, cols, end, seconds: Math.round(end / VX) });
}

const THEMES = [
  { name: 'Primeros Pasos', diff: 1, bpm: 124, lv: '#35f2d2', accent: '#35f2d2', glow: '#6ea8ff',
    bg: ['#1c2c78', '#0a0e33'], ground: '#0a1030', block: '#13235a', seed: 11 },
  { name: 'Zona Neón', diff: 2, bpm: 134, lv: '#ff4fd8', accent: '#ff4fd8', glow: '#9a6bff',
    bg: ['#4b1573', '#150a3b'], ground: '#150a33', block: '#2a1260', seed: 23 },
  { name: 'Núcleo Rojo', diff: 3, bpm: 146, lv: '#ffb23d', accent: '#ffb23d', glow: '#ff5a4d',
    bg: ['#6e1722', '#1b0710'], ground: '#1d0911', block: '#42101b', seed: 37 },
];

const SPECS = [
  { start: 24, seq: ['s1', 11, 's1', 10, 's2', 11, 'blk1', 10, 's3', 11, 'twin', 10, 'stairs2', 10, 's2', 10,
                     'bridge', 11, 'spkBlk', 10, 's1', 9, 's2', 10, 'half', 10, 'twin2', 10, 's3', 11, 'blk2', 10,
                     'twin', 10, 'stairs2', 10, 's2', 9, 'bridge2', 11, 'blkSpk', 10, 's1', 9, 'twin', 10, 's3'], tail: 16 },
  { start: 24, seq: ['s2', 11, 'pad1', 11, 'twin', 10, 'stairs2', 10, 'bridge2', 11, 'padBlock', 11, 'orb1', 11,
                     's3', 10, 'shipA', 11, 'blkSpk', 10, 'orb1', 11, 'twin2', 10, 'zig', 11, 'padTwo', 10, 's3'], tail: 16 },
  { start: 24, seq: ['s3', 10, 'orb2', 11, 'bridge2', 11, 'twin2', 10, 'shipB', 11, 'padTwo', 10, 'trio', 10,
                     'orb2', 11, 'zig', 10, 'shipA', 11, 'hurdles', 10, 'bridge2', 10, 'orb2', 11, 's3'], tail: 16 },

  set(k, v) { try { localStorage.setItem('neondash.' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ }
  },
};
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   AUDIO  (todo sintetizado con WebAudio, sin archivos)
   ===================================================================== */
const SND = (() => {
  let ac = null, master = null, noiseBuf = null, timer = 0, nextT = 0, stepI = 0, song = null;
  let enabled = store.get('sound', true) !== false;
  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const SCALE = [0, 3, 5, 7, 10, 12, 15];
  const SONGS = [
    { bpm: 124, root: 57, prog: [0, -4, -2, -5], bass: [0, 3, 6, 8, 11, 14], lead: [0, -1, 2, -1, 4, -1, 2, -1, 3, -1, 2, -1, 1, -1, 0, -1] },
    { bpm: 134, root: 55, prog: [0, 0, -2, 3], bass: [0, 2, 3, 6, 8, 10, 11, 14], lead: [4, -1, 3, 2, -1, 4, -1, 5, 4, -1, 2, -1, 3, -1, 1, -1] },
    { bpm: 146, root: 52, prog: [0, -2, -4, -5], bass: [0, 1, 3, 4, 6, 8, 9, 11, 12, 14], lead: [5, 4, -1, 2, 4, -1, 6, -1, 5, -1, 3, 4, -1, 2, 0, -1] },
  ];
  function init() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; return false; }
    return true;
  }
  function unlock() { if (init() && ac.state === 'suspended') ac.resume(); }
  function tone(type, f0, f1, t, dur, vol, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, vol, freq, type) {
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = type || 'highpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }
  function playStep(i, t) {
    const s = i % 16, bar = Math.floor(i / 16) % song.prog.length, r = song.root + song.prog[bar];
    if (s % 4 === 0) { tone('sine', 150, 42, t, 0.16, 0.5); }
    if (s === 4 || s === 12) { noise(t, 0.12, 0.16, 1800); tone('triangle', 220, 120, t, 0.08, 0.1); }
    if (s % 4 === 2) noise(t, 0.04, 0.06, 7000);
    if (song.bass.indexOf(s) >= 0) tone('sawtooth', midi(r - 24), midi(r - 24), t, 0.14, 0.13);
    const l = song.lead[s];
    if (l >= 0) tone('square', midi(r + SCALE[l]), midi(r + SCALE[l]), t, 0.11, 0.045);
  }
  function pump() {
    while (nextT < ac.currentTime + 0.14) {
      playStep(stepI, nextT);
      nextT += 60 / song.bpm / 4; stepI++;
    }
  }
  return {
    unlock,
    get on() { return enabled; },
    toggle() { enabled = !enabled; store.set('sound', enabled); if (!enabled) this.stop(); return enabled; },
    music(i) {
      this.stop();
      if (!enabled || !init()) return;
      if (ac.state === 'suspended') ac.resume();
      song = SONGS[i % SONGS.length]; stepI = 0; nextT = ac.currentTime + 0.04;
      pump(); timer = setInterval(pump, 25);
    },
    stop() { if (timer) { clearInterval(timer); timer = 0; } },
    suspend() { if (ac && ac.state === 'running') ac.suspend(); },
    resume() { if (ac && ac.state === 'suspended' && enabled) ac.resume(); },
    sfx(name) {
      if (!enabled || !ac) return;
      const t = ac.currentTime + 0.005;
      if (name === 'jump') tone('square', 380, 620, t, 0.09, 0.05);
      else if (name === 'pad') tone('triangle', 260, 1100, t, 0.2, 0.2);
      else if (name === 'orb') tone('sine', 700, 1400, t, 0.14, 0.2);
      else if (name === 'portal') { tone('sawtooth', 200, 900, t, 0.3, 0.1); tone('sine', 900, 300, t + 0.05, 0.25, 0.1); }
      else if (name === 'death') { noise(t, 0.35, 0.4, 600, 'lowpass'); tone('sawtooth', 240, 36, t, 0.45, 0.22); }
      else if (name === 'win') [0, 4, 7, 12, 16].forEach((n, k) => tone('triangle', midi(69 + n), midi(69 + n), t + k * 0.09, 0.3, 0.16));
    },
  };
})();

const app = $('#app'), cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, scale = 40, groundY = 0;
let scene = 'menu';            // menu | play | dead | pause | win
let lvIdx = 0, LV = LEVELS[0], P = newState();
let attempts = 0, acc = 0, deadT = 0, winT = 0, camX = 0, menuX = 0, menuLv = 0, wallT = 0;
let keyHold = false, ptrHold = false;
let shake = 0, flash = 0, flashCol = '255,255,255';
let particles = [], trailT = 0, shipAng = 0;
let skinIdx = Math.min(store.get('skin', 0) | 0, SKINS.length - 1);
let best = store.get('best', {});
let totalT = 0;

function pct() { return Math.min(100, Math.floor((P.x / LV.end) * 100)); }
function saveBest(p) {
  if ((best[lvIdx] || 0) < p) { best[lvIdx] = p; store.set('best', best); }
}

/* ---------- tamaño ---------- */
function resize() {
  const r = app.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(280, Math.round(r.width)); H = Math.max(220, Math.round(r.height));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.min(H / 11, W / 12.5);
  const top = (H - 11 * scale) / 2;
  groundY = top + 8.8 * scale;
}
window.addEventListener('resize', resize);

/* ---------- partículas ---------- */
function burst(x, y, n, colors, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.35 + Math.random() * 0.65);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 22, life: life * (0.6 + Math.random() * 0.5), max: life,
                     size: 0.12 + Math.random() * 0.2, col: colors[(Math.random() * colors.length) | 0], rot: Math.random() * 6 });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= p.g * dt;
  }
}

/* =====================================================================
   FLUJO: iniciar, morir, ganar, pausar
   ===================================================================== */
function showOnly(id) {
  for (const s of ['menu', 'pause', 'win']) $('#' + s).hidden = s !== id;
  $('#hud').hidden = id === 'menu' || id === 'win';
}
function startLevel(i) {
  lvIdx = i; LV = LEVELS[i]; attempts = 0; totalT = 0;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  showOnly(null);
  beginAttempt();
}
function beginAttempt() {
  P = newState(); attempts++; acc = 0; shipAng = 0; trailT = 0; tapPending = false;
  particles = []; shake = 0; flash = 0; scene = 'play';
  SND.music(lvIdx);
}
function die() {
  scene = 'dead'; deadT = 0.8;
  SND.stop(); SND.sfx('death');
  burst(P.x + .5, P.y + P.h / 2, 38, [SKINS[skinIdx].a, SKINS[skinIdx].b, '#ffffff'], 11, 0.9);
  if (!reduceMotion) { shake = 0.6; flash = 0.45; flashCol = '255,255,255'; }
  saveBest(pct());
}
function win() {
  scene = 'win'; winT = 0;
  SND.stop(); SND.sfx('win');
  saveBest(100);
  burst(P.x + .5, P.y + 1, 70, [SKINS[skinIdx].a, SKINS[skinIdx].b, LV.accent, '#ffffff'], 13, 1.6);
  if (!reduceMotion) { flash = 0.5; flashCol = '255,255,255'; }
}
function showWin() {
  $('#winName').textContent = LV.name;
  $('#winTries').textContent = attempts;
  $('#winTime').textContent = Math.round(totalT) + ' s';
  $('#wNext').hidden = lvIdx >= LEVELS.length - 1;
  showOnly('win');
  const b = $(lvIdx < LEVELS.length - 1 ? '#wNext' : '#wAgain'); b.focus();
}
function pause() {
  if (scene !== 'play') return;
  scene = 'pause'; SND.suspend(); showOnly('pause'); $('#hud').hidden = true; $('#pResume').focus();
}
function resume() {
  if (scene !== 'pause') return;
  scene = 'play'; SND.resume(); showOnly(null); if (document.activeElement) document.activeElement.blur();
  last = performance.now();
}
function toMenu() {
  scene = 'menu'; SND.stop(); particles = []; menuX = 0; refreshMenu(); showOnly('menu');
}

/* =====================================================================
   ENTRADA
   ===================================================================== */
let tapPending = false;        // un toque más corto que un fotograma no se pierde
const holdNow = () => keyHold || ptrHold;
function releaseAll() { keyHold = false; ptrHold = false; }
window.addEventListener('keydown', (e) => {
  const k = e.code;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') {
    if (scene === 'play' || scene === 'dead') { e.preventDefault(); keyHold = true; tapPending = true; SND.unlock(); }
  } else if (k === 'KeyP' || k === 'Escape') {
    if (scene === 'play') { e.preventDefault(); pause(); } else if (scene === 'pause') { e.preventDefault(); resume(); }
  } else if (k === 'KeyR') {
    if (scene === 'play' || scene === 'dead' || scene === 'pause') { showOnly(null); beginAttempt(); }
  } else if (k === 'KeyM') {
    setSound(SND.toggle());
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keyHold = false;
});
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); ptrHold = true; tapPending = true; SND.unlock(); });
window.addEventListener('pointerup', () => { ptrHold = false; });
window.addEventListener('pointercancel', releaseAll);
window.addEventListener('blur', () => { releaseAll(); if (scene === 'play') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play') pause(); });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

function setSound(on) { app.classList.toggle('muted', !on); if (on && (scene === 'play')) SND.music(lvIdx); }
$('#btnSnd').addEventListener('click', (e) => { SND.unlock(); setSound(SND.toggle()); e.currentTarget.blur(); });
$('#btnPause').addEventListener('click', (e) => { e.currentTarget.blur(); pause(); });
$('#pResume').addEventListener('click', resume);

$('#pMenu').addEventListener('click', toMenu);
$('#wNext').addEventListener('click', () => startLevel(lvIdx + 1));

/* ---------- menú ---------- */
function refreshMenu() {
  const box = $('#levels');
  box.textContent = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lv'; b.style.setProperty('--lv', lv.lv);
    const p = best[i] || 0;
    const pips = [1, 2, 3].map((n) => '<i class="' + (n <= lv.diff ? 'on' : '') + '"></i>').join('');
    b.innerHTML =
      '<h2></h2>' +
      '<div class="meta"><span class="pips" role="img" aria-label="Dificultad ' + lv.diff + ' de 3">' + pips + '</span>' +

    sk.appendChild(b);

}

/* =====================================================================
   DIBUJO
   ===================================================================== */
const wx = (x) => (x - camX) * scale;
const wy = (y) => groundY - y * scale;
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const FONT = "'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', system-ui, sans-serif";

function shapesFor(th) {
  if (th.shapes) return th.shapes;
  const r = rng(th.seed), out = [];
  for (let i = 0; i < 16; i++) out.push({ x: r(), y: r(), s: 0.7 + r() * 2.2, t: (r() * 3) | 0, a: r() * 6.28, layer: i % 2 });
  th.shapes = out; return out;
}

function drawBackground(th, cam, pulse) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.bg[0]); g.addColorStop(1, th.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const span = W + 400;
  for (const s of shapesFor(th)) {
    const par = s.layer ? 0.22 : 0.1;
    const px = (((s.x * span - cam * scale * par) % span) + span) % span - 200;
    const py = s.y * (groundY * 0.95);
    const size = s.s * scale;
    ctx.save(); ctx.translate(px, py); ctx.rotate(s.a + cam * 0.02 * (s.layer ? 1 : -1));
    ctx.globalAlpha = s.layer ? 0.1 : 0.06;
    ctx.fillStyle = th.glow; ctx.strokeStyle = th.glow; ctx.lineWidth = 3;
    if (s.t === 0) ctx.fillRect(-size / 2, -size / 2, size, size);
    else if (s.t === 1) { ctx.beginPath(); ctx.moveTo(0, -size / 2); ctx.lineTo(size / 2, size / 2); ctx.lineTo(-size / 2, size / 2); ctx.closePath(); ctx.fill(); }
    else ctx.strokeRect(-size / 2, -size / 2, size, size);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  const hz = ctx.createLinearGradient(0, groundY - 4 * scale, 0, groundY);
  hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(1, th.accent + '33');
  ctx.fillStyle = hz; ctx.fillRect(0, groundY - 4 * scale, W, 4 * scale);
  if (pulse > 0.01) { ctx.fillStyle = 'rgba(255,255,255,' + (0.045 * pulse).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
}

function drawGround(th, cam, pulse) {
  ctx.fillStyle = th.ground; ctx.fillRect(0, groundY, W, Math.max(0, H - groundY));
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.beginPath();
  const first = Math.floor(cam / 2) * 2;
  for (let x = first; x < cam + W / scale + 2; x += 2) { const sx = Math.round(wx(x)) + 0.5; ctx.moveTo(sx, groundY); ctx.lineTo(sx, H); }
  ctx.moveTo(0, groundY + scale * 1.1); ctx.lineTo(W, groundY + scale * 1.1);
  ctx.stroke();
  ctx.fillStyle = th.accent;
  ctx.globalAlpha = 0.18 + 0.14 * pulse; ctx.fillRect(0, groundY - 4, W, 12);
  ctx.globalAlpha = 1; ctx.fillRect(0, groundY - 2, W, 4);
}

function drawBlock(th, o) {
  const x = wx(o.x), w = o.w * scale, h = o.h * scale, y = wy(o.y + o.h);
  if (x > W || x + w < 0) return;
  ctx.fillStyle = th.block; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 1; i < o.w; i++) { ctx.moveTo(x + i * scale, y); ctx.lineTo(x + i * scale, y + h); }
  const j0 = Math.max(1, Math.floor(-y / scale)), j1 = Math.min(o.h - 1, Math.ceil((H - y) / scale));
  for (let j = j0; j <= j1; j++) { ctx.moveTo(x, y + j * scale); ctx.lineTo(x + w, y + j * scale); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x, y, w, Math.min(h, scale * 0.16));
  ctx.strokeStyle = th.accent; ctx.lineWidth = 2.5; ctx.strokeRect(x + 1.25, y + 1.25, w - 2.5, h - 2.5);
}

function drawSpike(th, o) {
  const x = wx(o.x), s = scale;
  if (x > W || x + s < 0) return;
  const h = s * o.size;
  ctx.beginPath();
  if (o.dir === 'up') { const b = wy(o.y); ctx.moveTo(x + 1, b); ctx.lineTo(x + s / 2, b - h); ctx.lineTo(x + s - 1, b); }
  else { const t = wy(o.y + 1); ctx.moveTo(x + 1, t); ctx.lineTo(x + s / 2, t + h); ctx.lineTo(x + s - 1, t); }
  ctx.closePath();
  ctx.fillStyle = '#05060f'; ctx.fill();
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.stroke();
  ctx.lineJoin = 'miter';
}

function drawPad(o) {
  const x = wx(o.x), b = wy(o.y), s = scale;
  if (x > W || x + s < 0) return;
  ctx.fillStyle = '#ffd84a';
  ctx.beginPath(); ctx.ellipse(x + s / 2, b, s * 0.46, s * 0.22, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#05060f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,216,74,.22)'; ctx.fillRect(x + s * 0.12, b - s * 0.65, s * 0.76, s * 0.4);
}

function drawOrb(o, t) {
  const cx = wx(o.x + 0.5), cy = wy(o.y + 0.5), s = scale;
  if (cx > W + s || cx < -s) return;
  const pulse = (t * 1.6) % 1;
  ctx.strokeStyle = 'rgba(255,216,74,' + (0.6 * (1 - pulse)).toFixed(3) + ')'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, s * (0.36 + 0.3 * pulse), 0, 6.283); ctx.stroke();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(cx, cy, s * 0.3, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#05060f'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(cx - s * 0.08, cy - s * 0.09, s * 0.08, 0, 6.283); ctx.fill();
}

function drawPortal(o, t) {
  const cx = wx(o.x + 0.5), top = wy(o.y + o.h), h = o.h * scale;
  if (cx > W + scale || cx < -scale) return;
  const col = o.to === 'ship' ? '#ff4fd8' : '#35f2d2';
  const grd = ctx.createLinearGradient(0, top, 0, top + h);
  grd.addColorStop(0, col + '00'); grd.addColorStop(0.5, col + '66'); grd.addColorStop(1, col + '00');
  ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(cx, top + h / 2, scale * 0.5, h / 2, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(cx, top + h / 2, scale * 0.34, h / 2, 0, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath();
  const off = (t * 40) % 24;
  ctx.ellipse(cx, top + h / 2, scale * 0.34, h / 2 - off * (scale / 60), 0, 0, 6.283); ctx.stroke();
}

function drawFinish(th) {
  const x = wx(LV.end);
  if (x > W + 10 || x < -scale * 2) return;
  const g = ctx.createLinearGradient(x, 0, x + scale * 3, 0);
  g.addColorStop(0, th.accent + 'cc'); g.addColorStop(1, th.accent + '00');
  ctx.fillStyle = g; ctx.fillRect(x, 0, scale * 3, groundY);
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 3, 0, 6, groundY);
}

function drawCube(S, skin) {
  const r = S * 0.14;
  ctx.fillStyle = '#05060f'; rr(-S / 2, -S / 2, S, S, r); ctx.fill();
  ctx.fillStyle = skin.a; rr(-S / 2 + 3, -S / 2 + 3, S - 6, S - 6, r * 0.7); ctx.fill();
  const inn = S * 0.6;
  ctx.fillStyle = skin.b; rr(-inn / 2, -inn / 2, inn, inn, r * 0.5); ctx.fill();
  ctx.fillStyle = '#05060f';
  const e = S * 0.15;
  ctx.fillRect(-S * 0.2 - e / 2, -S * 0.12 - e / 2, e, e);
  ctx.fillRect(S * 0.2 - e / 2, -S * 0.12 - e / 2, e, e);
  ctx.fillRect(-S * 0.18, S * 0.12, S * 0.36, S * 0.07);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-S / 2 + 4, -S / 2 + 4, S * 0.4, 3);
}

function drawShip(S, skin, t) {
  ctx.fillStyle = '#05060f';
  ctx.beginPath();
  ctx.moveTo(-S * .62, S * .02); ctx.lineTo(-S * .42, -S * .12); ctx.lineTo(S * .34, -S * .12); ctx.lineTo(S * .68, S * .1);
  ctx.lineTo(S * .46, S * .3); ctx.lineTo(-S * .5, S * .3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = skin.a;
  ctx.beginPath();
  ctx.moveTo(-S * .56, S * .03); ctx.lineTo(-S * .4, -S * .08); ctx.lineTo(S * .32, -S * .08); ctx.lineTo(S * .6, S * .1);
  ctx.lineTo(S * .43, S * .25); ctx.lineTo(-S * .46, S * .25); ctx.closePath(); ctx.fill();
  ctx.fillStyle = skin.b; ctx.fillRect(-S * .4, S * .1, S * .6, S * .06);
  ctx.save(); ctx.translate(S * .02, -S * .2); drawCube(S * 0.5, skin); ctx.restore();
  const f = 0.7 + 0.3 * Math.sin(t * 60);
  ctx.fillStyle = '#ff9d2e'; ctx.beginPath(); ctx.moveTo(-S * .5, S * .06); ctx.lineTo(-S * (.62 + .3 * f), S * .13); ctx.lineTo(-S * .5, S * .22); ctx.closePath(); ctx.fill();
}

function drawPlayer(t) {
  const skin = SKINS[skinIdx];
  ctx.save();
  ctx.translate(wx(P.x + P.w / 2), wy(P.y + P.h / 2));
  ctx.rotate(P.rot * Math.PI / 180);
  if (P.mode === 'cube') drawCube(scale * 0.98, skin); else drawShip(scale, skin, t);
  ctx.restore();
}

function drawParticles() {
  const skin = SKINS[skinIdx];
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col || skin.a;
    const s = p.size * scale * (p.kind === 'trail' ? a : 0.6 + 0.4 * a);
    ctx.save(); ctx.translate(wx(p.x), wy(p.y)); ctx.rotate(p.rot + p.life * 6);
    ctx.fillRect(-s / 2, -s / 2, s, s); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawWorld(lv, cam, pulse, t, withObjects) {
  drawBackground(lv, cam, pulse);
  drawGround(lv, cam, pulse);
  const c0 = Math.floor(cam) - 1, c1 = Math.ceil(cam + W / scale) + 1;
  const seen = new Set();
  for (let c = c0; c <= c1; c++) {
    const list = lv.cols[c];
    if (!list) continue;
    for (const o of list) {
      if (seen.has(o)) continue;
      seen.add(o);
      if (o.k === 'b') drawBlock(lv, o);
      else if (o.k === 'h') drawSpike(lv, o);
      else if (o.k === 'p') drawPad(o);
      else if (o.k === 'o') drawOrb(o, t);
      else if (o.k === 'g') drawPortal(o, t);
    }
  }
  if (withObjects) drawFinish(lv);
}

function drawHUD() {
  const narrow = W < 720;
  const bw = narrow ? Math.max(120, W - 16 - 118 - 58) : Math.min(W * 0.46, 460);
  const bx = narrow ? 16 : (W - bw) / 2, by = 30;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(bx, by, bw, 12, 6); ctx.fill();
  const p = Math.min(1, P.x / LV.end);
  if (p > 0) { ctx.fillStyle = LV.accent; rr(bx, by, Math.max(12, bw * p), 12, 6); ctx.fill(); }
  const b = (best[lvIdx] || 0) / 100;
  if (b > 0 && b < 1) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(bx + bw * b - 1, by - 3, 2, 18); }
  ctx.fillStyle = '#fff'; ctx.font = '400 20px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(pct() + ' %', bx + bw + 12, by + 7);
  ctx.textAlign = 'left';
}

function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (scene === 'menu') {
    const th = LEVELS[menuLv];
    camX = menuX;
    const beat = ((wallT * th.bpm) / 60) % 1;
    drawWorld(th, camX, Math.pow(1 - beat, 3), wallT, false);
    return;
  }
  const beat = ((P.t * LV.bpm) / 60) % 1;
  const pulse = scene === 'dead' ? 0 : Math.pow(1 - beat, 3);
  camX = P.x - (W / scale) * 0.26;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * scale * 0.5, (Math.random() - 0.5) * shake * scale * 0.5);
  drawWorld(LV, camX, pulse, P.t, true);
  if (scene !== 'dead') {
    drawParticles();
    drawPlayer(P.t);
  } else drawParticles();
  // texto de intento
  ctx.globalAlpha = 0.9; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '400 ' + Math.round(scale * 0.8) + 'px ' + FONT;
  ctx.fillText('Intento ' + attempts, wx(10), wy(5.6));
  ctx.globalAlpha = 0.6; ctx.font = '400 ' + Math.round(scale * 0.42) + 'px ' + FONT;
  ctx.fillText(LV.name, wx(10), wy(4.7));
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = 'rgba(' + flashCol + ',' + Math.min(1, flash).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  if (scene === 'play' || scene === 'dead') drawHUD();
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let last = performance.now();
function handleEvents() {
  if (!P.ev) return;
  if (P.ev & EV_JUMP) SND.sfx('jump');
  if (P.ev & EV_PAD) SND.sfx('pad');
  if (P.ev & EV_ORB) SND.sfx('orb');
  if (P.ev & EV_PORTAL) {
    SND.sfx('portal');
    if (!reduceMotion) { flash = 0.25; flashCol = P.mode === 'ship' ? '255,79,216' : '53,242,210'; }
  }
  P.ev = 0;
}
function updateVisuals(dt) {
  if (P.mode === 'cube') {
    if (!P.ground) P.rot += 520 * dt;
    else { P.rot %= 360; const tgt = Math.round(P.rot / 90) * 90; P.rot += (tgt - P.rot) * Math.min(1, dt * 20); }
  } else {
    const tgt = -Math.atan2(P.vy, VX) * 57.3 * 0.9;
    P.rot += (tgt - P.rot) * Math.min(1, dt * 14);
  }
  trailT -= dt;
  if (trailT <= 0) {
    trailT = 0.03;
    const sk = SKINS[skinIdx];
    if (P.mode === 'cube') {
      if (P.ground) particles.push({ x: P.x, y: P.y + 0.08, vx: -2.5, vy: 1.5 + Math.random() * 1.5, g: 8, life: 0.35, max: 0.35, size: 0.2, col: sk.a, rot: Math.random() * 6, kind: 'trail' });
    } else {
      particles.push({ x: P.x - 0.1, y: P.y + 0.3, vx: -4, vy: (Math.random() - 0.5) * 2, g: 0, life: 0.3, max: 0.3, size: 0.26, col: '#ff9d2e', rot: Math.random() * 6, kind: 'trail' });
    }
  }
}
function update(dt) {
  wallT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 1.6);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  if (scene === 'menu') {
    menuX += dt * 7;
    if (menuX > LEVELS[menuLv].end - 8) { menuX = 0; menuLv = (menuLv + 1) % LEVELS.length; }
    return;
  }
  if (scene === 'play') {
    totalT += dt;
    acc += dt;
    while (acc >= DT && scene === 'play') {
      step(P, LV, holdNow() || tapPending);
      tapPending = false;
      handleEvents();
      acc -= DT;
      if (P.dead) die(); else if (P.done) win();
    }
    if (scene === 'play') updateVisuals(dt);
    updateParticles(dt);
  } else if (scene === 'dead') {
    deadT -= dt; updateParticles(dt);
    if (deadT <= 0) beginAttempt();
  } else if (scene === 'win') {
    winT += dt; P.x += VX * dt * Math.max(0, 1 - winT * 0.8); updateParticles(dt);
    if (P.mode === 'cube') { P.ground = true; P.rot += (Math.round(P.rot / 90) * 90 - P.rot) * Math.min(1, dt * 20); }
    if (winT > 1.1 && $('#win').hidden) showWin();
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (scene === 'pause') { render(dt); return; }
  update(dt);
  render(dt);
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
app.classList.toggle('muted', !SND.on);
resize();
refreshMenu();
requestAnimationFrame(frame);
if (window.ResizeObserver) new ResizeObserver(resize).observe(app);

// Acceso para pruebas automáticas (no se usa en el juego)
window.NeonDash = {
  levels: LEVELS, newState, step, DT, VX, setMargin(m) { MARGIN = m; },
};
})();
</script>
</body>
</html>
